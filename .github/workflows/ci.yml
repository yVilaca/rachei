name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  frontend:
    name: Typecheck + build + testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm é o gerenciador do projeto (versão fixada em package.json > packageManager)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # Lint ainda tem dívida pré-existente — reporta mas não bloqueia (ratchet).
      - name: Lint (não-bloqueante)
        run: pnpm run lint
        continue-on-error: true

      # Gates rígidos: o build inclui o typecheck (tsc -b) e falha o deploy se quebrar.
      - name: Typecheck + build
        run: pnpm run build

      - name: Testes (Vitest)
        run: pnpm run test:run
