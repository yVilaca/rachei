name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  frontend:
    name: Typecheck + build + testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # .npmrc fixa legacy-peer-deps (conflito eslint10 x jsx-a11y) — install reprodutível
      - name: Instalar dependências
        run: npm ci

      # Lint ainda tem dívida pré-existente — reporta mas não bloqueia (ratchet).
      - name: Lint (não-bloqueante)
        run: npm run lint
        continue-on-error: true

      # Gates rígidos: o build inclui o typecheck (tsc -b) e falha o deploy se quebrar.
      - name: Typecheck + build
        run: npm run build

      - name: Testes (Vitest)
        run: npm run test:run
